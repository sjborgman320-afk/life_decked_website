<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>LodgeCon_Esports_email</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f4f1eb;
      color: #29251f;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px);
      box-sizing: border-box;
      padding: 32px;
      border: 1px solid #d8c9a9;
      border-radius: 14px;
      background: #fff;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; font-size: 1.55rem; }
    p { line-height: 1.5; }
    a.button {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 24px;
      border-radius: 8px;
      background: #6f1d2b;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a.button:focus { outline: 3px solid #c79d45; outline-offset: 3px; }
    .small { margin-top: 20px; color: #625d55; font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <h1>LodgeCon eSports</h1>
    <p>Your email will be addressed to the LodgeCon eSports contact. The subject includes today's date from your device.</p>
    <a class="button" id="email-link" href="mailto:sjborgman@comcast.net">Open Email</a>
    <p class="small">Your email app will open with the message ready for you to review and send.</p>
  </main>

  <script>
    (function () {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      const localDate = `${year}/${month}/${day}`;
      const subject = `Lodge Con eSports – ${localDate}`;
      const mailto = `mailto:sjborgman@comcast.net?subject=${encodeURIComponent(subject)}`;

      const emailLink = document.getElementById("email-link");
      emailLink.href = mailto;

      // Attempt to open the email app automatically; the visible button is the fallback.
      window.setTimeout(function () {
        window.location.href = mailto;
      }, 250);
    })();
  </script>
</body>
</html>
